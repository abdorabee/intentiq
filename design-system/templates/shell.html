<!-- @dsCard group="{{GROUP}}" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VesperWise — {{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   GENERATED FILE — do not edit by hand.
   Source: design-system/fragments/{{FRAGMENT}}
   Rebuild: node design-system/build.mjs
   Tokens parsed from app/theme-overrides.css + app/globals.css
   =========================================================== */

/* --- Font shims: next/font provides these at runtime --- */
:root {
  --font-inter: "Inter";
  --font-jetbrains: "JetBrains Mono";
}

/* --- Theme-independent tokens (radius ramps, motion) --- */
.ds-pane {
{{VARS_COMMON}}
}

/* --- Dark palette (app default: <html class="dark">) --- */
.theme-dark {
{{VARS_DARK}}
}

/* --- Light palette --- */
.theme-light {
{{VARS_LIGHT}}
}

/* ================= preview chrome ================= */
* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body {
  margin: 0;
  padding: 28px;
  background: #17181a;
  font-family: var(--font-inter), ui-sans-serif, system-ui, sans-serif;
  font-feature-settings: "ss01", "cv11";
  color: #e6e7e9;
}
.ds-header { margin-bottom: 20px; }
.ds-title {
  font-size: 20px; font-weight: 600; letter-spacing: -0.024em;
  color: #ffffff; margin: 0 0 5px;
}
.ds-sub {
  font-size: 13px; color: #9ba0a6; margin: 0;
  letter-spacing: -0.006em; max-width: 78ch; line-height: 1.5;
}
.ds-source {
  display: inline-block; margin-top: 9px;
  font-family: var(--font-jetbrains), ui-monospace, monospace;
  font-size: 10.5px; color: #7e838a;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 999px; padding: 3px 9px;
}
.ds-panes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.ds-panes.stack { grid-template-columns: 1fr; }
.ds-pane {
  position: relative;
  border-radius: 14px;
  padding: 34px 22px 22px;
  overflow: hidden;
  background: var(--bg);
  color: var(--text-primary);
  border: 1px solid rgba(255,255,255,0.09);
  font-size: 13px;
  letter-spacing: -0.011em;
}
.theme-light.ds-pane { border-color: rgba(10,14,26,0.16); }
.ds-pane::before {
  content: attr(data-label);
  position: absolute; top: 0; left: 0;
  font-family: var(--font-jetbrains), ui-monospace, monospace;
  font-size: 9.5px; font-weight: 600; letter-spacing: 0.09em;
  text-transform: uppercase;
  padding: 5px 10px;
  color: var(--text-tertiary);
  background: var(--surface);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  border-radius: 14px 0 8px 0;
}
.ds-section {
  font-family: var(--font-jetbrains), ui-monospace, monospace;
  font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-quaternary);
  margin: 24px 0 11px;
}
.ds-section:first-child { margin-top: 0; }
.ds-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.ds-col { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.ds-note {
  font-size: 11.5px; color: var(--text-tertiary);
  line-height: 1.55; margin-top: 12px; letter-spacing: -0.006em;
}
.ds-note code, .ds-mono {
  font-family: var(--font-jetbrains), ui-monospace, monospace;
  font-size: 0.92em;
}
.ds-note code {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 4px; color: var(--text-secondary);
}
.ds-warn {
  margin-top: 14px; padding: 9px 11px;
  border-radius: 8px; font-size: 11.5px; line-height: 1.5;
  background: var(--warm-bg); border: 1px solid var(--warm-border);
  color: var(--warm);
}
/* spec table */
.ds-spec { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.ds-spec th {
  text-align: left; font-weight: 500; padding: 5px 10px 5px 0;
  color: var(--text-quaternary); font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.06em;
  border-bottom: 1px solid var(--border);
}
.ds-spec td {
  padding: 6px 10px 6px 0; vertical-align: middle;
  border-bottom: 1px solid var(--border-subtle);
  color: var(--text-secondary);
}
.ds-spec td.k {
  font-family: var(--font-jetbrains), ui-monospace, monospace;
  color: var(--text-primary); white-space: nowrap;
}
.ds-spec td.v {
  font-family: var(--font-jetbrains), ui-monospace, monospace;
  color: var(--text-tertiary); white-space: nowrap;
}
/* swatches */
.ds-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 9px; }
.ds-swatch { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.ds-chip {
  height: 40px; border-radius: 8px;
  border: 1px solid var(--border-strong);
}
.ds-swatch .n {
  font-family: var(--font-jetbrains), ui-monospace, monospace;
  font-size: 10px; color: var(--text-secondary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ds-swatch .h {
  font-family: var(--font-jetbrains), ui-monospace, monospace;
  font-size: 9.5px; color: var(--text-quaternary);
}
@media (max-width: 900px) { .ds-panes { grid-template-columns: 1fr; } }
{{EXTRA_CSS}}
</style>
</head>
<body>
<div class="ds-header">
  <h1 class="ds-title">{{TITLE}}</h1>
  <p class="ds-sub">{{SUBTITLE}}</p>
  <span class="ds-source">{{SOURCE}}</span>
</div>
<div class="ds-panes {{LAYOUT}}">
  <div class="ds-pane theme-dark" data-label="Dark — default">
{{BODY}}
  </div>
  <div class="ds-pane theme-light" data-label="Light">
{{BODY}}
  </div>
</div>
<script>
/* 1. Expand [data-swatches="--a,--b"] into swatch tiles. */
document.querySelectorAll("[data-swatches]").forEach(function (host) {
  host.getAttribute("data-swatches").split(",").forEach(function (name) {
    name = name.trim();
    if (!name) return;
    var el = document.createElement("div");
    el.className = "ds-swatch";
    el.innerHTML =
      '<div class="ds-chip" style="background:var(' + name + ')"></div>' +
      '<div class="n">' + name + '</div>' +
      '<div class="h" data-token="' + name + '">' + name + '</div>';
    host.appendChild(el);
  });
});

/* 2. Resolve token names to their computed value per pane, so no value in
      this bundle is ever hand-typed. Falls back to the name if JS is blocked. */
document.querySelectorAll("[data-token]").forEach(function (el) {
  var pane = el.closest(".ds-pane");
  if (!pane) return;
  var v = getComputedStyle(pane).getPropertyValue(el.getAttribute("data-token")).trim();
  if (v) el.textContent = v;
});
</script>
{{EXTRA_JS}}
</body>
</html>
